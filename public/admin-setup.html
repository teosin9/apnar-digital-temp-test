<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin setup — Apnar digital (local)</title><style>body{font-family:system-ui;background:#111;color:#eee;max-width:600px;margin:40px auto;padding:20px}input{width:100%;padding:8px;margin:6px 0;background:#222;color:#eee;border:1px solid #444;border-radius:8px}button{background:#ff7a1a;color:#fff;border:0;padding:10px 18px;border-radius:8px;cursor:pointer}</style></head>
<body><h1>First-run admin setup (local only)</h1><p>Enter an admin email + password here. The server stores only a salted hash — never a plain password, and no credentials are in code.</p>
<input id="email" placeholder="Admin email"><input id="pw" type="password" placeholder="Admin password (min 8 characters)">
<button onclick="setup()">Create admin account</button><p id="msg"></p><p><a href="/admin" style="color:#ff7a1a">Go to admin panel</a> · <a href="/" style="color:#ff7a1a">Public page</a></p>
<script>async function setup(){const r=await fetch('/api/setup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:pw.value})});const d=await r.json();msg.textContent=d.ok?'Admin created. Go to /admin.':(d.error||'Failed')}</script></body></html>
